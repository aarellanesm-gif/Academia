<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gradCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield Base -->
  <rect width="512" height="512" rx="128" fill="url(#gradBg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />

  <!-- Shield Badge Outline -->
  <path d="M 256 90 L 390 140 C 390 280 256 390 256 420 C 256 390 122 280 122 140 Z" fill="rgba(15, 23, 42, 0.55)" stroke="url(#gradCap)" stroke-width="8" filter="url(#glow)" />

  <!-- Graduation Cap Icon -->
  <!-- Main Diamond Top -->
  <polygon points="256,155 400,215 256,275 112,215" fill="url(#gradCap)" />
  <!-- Under Cap Box -->
  <path d="M 176 250 L 176 300 C 176 330 336 330 336 300 L 336 250 Z" fill="url(#gradCap)" opacity="0.85" />
  <!-- Tassel Drop -->
  <path d="M 360 230 L 360 315 L 350 315 L 350 230 Z" fill="url(#gradGold)" />
  <circle cx="355" cy="325" r="14" fill="url(#gradGold)" />
  
  <!-- Glowing Center Star -->
  <path d="M 256 345 L 263 365 L 285 365 L 267 378 L 273 398 L 256 385 L 239 398 L 245 378 L 227 365 L 249 365 Z" fill="url(#gradGold)" />
</svg>
